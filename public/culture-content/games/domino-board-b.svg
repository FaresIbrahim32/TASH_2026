<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="feltDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2b"/>
      <stop offset="100%" stop-color="#6b4321"/>
    </linearGradient>
    <linearGradient id="ivoryB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#efe7d4"/>
    </linearGradient>
    <filter id="tileShadowDB" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a1808" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="340" rx="24" fill="url(#feltDB)"/>

  <!-- Tiles A-E: w140 h80, start 60 pitch 160, y 140; pip r=5 -->

  <!-- A: 2 | 5 -->
  <g filter="url(#tileShadowDB)">
    <rect x="60" y="140" width="140" height="80" rx="12" fill="url(#ivoryB)" stroke="#c9bfa6" stroke-width="2"/>
    <line x1="130" y1="148" x2="130" y2="212" stroke="#b7ac90" stroke-width="3"/>
    <g fill="#1e1a12">
      <circle cx="82" cy="167" r="5"/><circle cx="108" cy="193" r="5"/>
      <circle cx="152" cy="167" r="5"/><circle cx="178" cy="167" r="5"/><circle cx="165" cy="180" r="5"/><circle cx="152" cy="193" r="5"/><circle cx="178" cy="193" r="5"/>
    </g>
  </g>
  <text x="130" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff6e6">A</text>

  <!-- B: 1 | 4  (correct) -->
  <g filter="url(#tileShadowDB)">
    <rect x="220" y="140" width="140" height="80" rx="12" fill="url(#ivoryB)" stroke="#c9bfa6" stroke-width="2"/>
    <line x1="290" y1="148" x2="290" y2="212" stroke="#b7ac90" stroke-width="3"/>
    <g fill="#1e1a12">
      <circle cx="255" cy="180" r="5"/>
      <circle cx="312" cy="167" r="5"/><circle cx="338" cy="167" r="5"/><circle cx="312" cy="193" r="5"/><circle cx="338" cy="193" r="5"/>
    </g>
  </g>
  <text x="290" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff6e6">B</text>

  <!-- C: 3 | 6 -->
  <g filter="url(#tileShadowDB)">
    <rect x="380" y="140" width="140" height="80" rx="12" fill="url(#ivoryB)" stroke="#c9bfa6" stroke-width="2"/>
    <line x1="450" y1="148" x2="450" y2="212" stroke="#b7ac90" stroke-width="3"/>
    <g fill="#1e1a12">
      <circle cx="402" cy="167" r="5"/><circle cx="415" cy="180" r="5"/><circle cx="428" cy="193" r="5"/>
      <circle cx="472" cy="167" r="5"/><circle cx="498" cy="167" r="5"/><circle cx="472" cy="180" r="5"/><circle cx="498" cy="180" r="5"/><circle cx="472" cy="193" r="5"/><circle cx="498" cy="193" r="5"/>
    </g>
  </g>
  <text x="450" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff6e6">C</text>

  <!-- D: 2 | 3 -->
  <g filter="url(#tileShadowDB)">
    <rect x="540" y="140" width="140" height="80" rx="12" fill="url(#ivoryB)" stroke="#c9bfa6" stroke-width="2"/>
    <line x1="610" y1="148" x2="610" y2="212" stroke="#b7ac90" stroke-width="3"/>
    <g fill="#1e1a12">
      <circle cx="562" cy="167" r="5"/><circle cx="588" cy="193" r="5"/>
      <circle cx="632" cy="167" r="5"/><circle cx="645" cy="180" r="5"/><circle cx="658" cy="193" r="5"/>
    </g>
  </g>
  <text x="610" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff6e6">D</text>

  <!-- E: 5 | 6 -->
  <g filter="url(#tileShadowDB)">
    <rect x="700" y="140" width="140" height="80" rx="12" fill="url(#ivoryB)" stroke="#c9bfa6" stroke-width="2"/>
    <line x1="770" y1="148" x2="770" y2="212" stroke="#b7ac90" stroke-width="3"/>
    <g fill="#1e1a12">
      <circle cx="722" cy="167" r="5"/><circle cx="748" cy="167" r="5"/><circle cx="735" cy="180" r="5"/><circle cx="722" cy="193" r="5"/><circle cx="748" cy="193" r="5"/>
      <circle cx="792" cy="167" r="5"/><circle cx="818" cy="167" r="5"/><circle cx="792" cy="180" r="5"/><circle cx="818" cy="180" r="5"/><circle cx="792" cy="193" r="5"/><circle cx="818" cy="193" r="5"/>
    </g>
  </g>
  <text x="770" y="252" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff6e6">E</text>
</svg>
