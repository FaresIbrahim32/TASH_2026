<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="feltA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6f63"/>
      <stop offset="100%" stop-color="#12564c"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ede9"/>
    </linearGradient>
    <linearGradient id="homeTileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f5cf6b"/>
    </linearGradient>
    <radialGradient id="tokYellow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="45%" stop-color="#ffc924"/>
      <stop offset="100%" stop-color="#c98f00"/>
    </radialGradient>
    <radialGradient id="tokBlue" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8fb6ff"/>
      <stop offset="45%" stop-color="#2f6ad9"/>
      <stop offset="100%" stop-color="#123a8f"/>
    </radialGradient>
    <filter id="softShadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04211d" flood-opacity="0.35"/>
    </filter>
    <filter id="tokShadowA" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="400" rx="24" fill="url(#feltA)"/>
  <rect x="10" y="10" width="880" height="380" rx="18" fill="none" stroke="#0d4a41" stroke-width="4"/>

  <!-- Path bar behind the tiles -->
  <rect x="58" y="196" width="792" height="72" rx="36" fill="#0e4c43"/>

  <!-- Track tiles: 11 cells (indices 0..10), pitch 72 -->
  <g filter="url(#softShadowA)">
    <rect x="70"  y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="142" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="214" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="286" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="358" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="430" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="502" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="574" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="646" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="718" y="200" width="64" height="64" rx="12" fill="url(#tileA)"/>
    <rect x="790" y="200" width="64" height="64" rx="12" fill="url(#homeTileA)" stroke="#c79320" stroke-width="3"/>
  </g>

  <!-- Home marker (house icon) on the last, highlighted tile -->
  <g transform="translate(822,232)">
    <path d="M -16 4 L 0 -12 L 16 4 Z" fill="#b8791a"/>
    <rect x="-11" y="4" width="22" height="16" fill="#b8791a"/>
    <rect x="-4" y="9" width="8" height="11" fill="#f5cf6b"/>
  </g>

  <!-- Yellow token on cell 0 (x-center 102) -->
  <g filter="url(#tokShadowA)">
    <circle cx="102" cy="232" r="26" fill="url(#tokYellow)" stroke="#a97a00" stroke-width="2"/>
    <ellipse cx="94" cy="223" rx="9" ry="6" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Blue token on cell 5 (x-center 462) -->
  <g filter="url(#tokShadowA)">
    <circle cx="462" cy="232" r="26" fill="url(#tokBlue)" stroke="#0e2f73" stroke-width="2"/>
    <ellipse cx="454" cy="223" rx="9" ry="6" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
