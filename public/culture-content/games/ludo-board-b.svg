<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="feltB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6f63"/>
      <stop offset="100%" stop-color="#12564c"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ede9"/>
    </linearGradient>
    <linearGradient id="homeTileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f5cf6b"/>
    </linearGradient>
    <radialGradient id="tokGreen" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b6f0c4"/>
      <stop offset="45%" stop-color="#2fae57"/>
      <stop offset="100%" stop-color="#136b30"/>
    </radialGradient>
    <radialGradient id="tokRed" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffb5ad"/>
      <stop offset="45%" stop-color="#e23b2e"/>
      <stop offset="100%" stop-color="#8f130a"/>
    </radialGradient>
    <filter id="softShadowB" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04211d" flood-opacity="0.35"/>
    </filter>
    <filter id="tokShadowB" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="400" rx="24" fill="url(#feltB)"/>
  <rect x="10" y="10" width="880" height="380" rx="18" fill="none" stroke="#0d4a41" stroke-width="4"/>

  <!-- Path bar behind the tiles: 8 cells, start 166, pitch 72 -->
  <rect x="154" y="196" width="560" height="72" rx="36" fill="#0e4c43"/>

  <g filter="url(#softShadowB)">
    <rect x="166" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="238" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="310" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="382" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="454" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="526" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="598" y="200" width="64" height="64" rx="12" fill="url(#tileB)"/>
    <rect x="670" y="200" width="64" height="64" rx="12" fill="url(#homeTileB)" stroke="#c79320" stroke-width="3"/>
  </g>

  <!-- Home marker (house icon) on last, highlighted tile (cell 7, center 702) -->
  <g transform="translate(702,232)">
    <path d="M -16 4 L 0 -12 L 16 4 Z" fill="#b8791a"/>
    <rect x="-11" y="4" width="22" height="16" fill="#b8791a"/>
    <rect x="-4" y="9" width="8" height="11" fill="#f5cf6b"/>
  </g>

  <!-- Green token on cell 0 (center 198) -->
  <g filter="url(#tokShadowB)">
    <circle cx="198" cy="232" r="26" fill="url(#tokGreen)" stroke="#0f5626" stroke-width="2"/>
    <ellipse cx="190" cy="223" rx="9" ry="6" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Red token on cell 3 (center 414) -->
  <g filter="url(#tokShadowB)">
    <circle cx="414" cy="232" r="26" fill="url(#tokRed)" stroke="#7c1009" stroke-width="2"/>
    <ellipse cx="406" cy="223" rx="9" ry="6" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
